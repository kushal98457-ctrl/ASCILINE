name: ASCILINE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  python-test:
    name: Python CI & Codec Verification
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js (for vector validation)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install System Dependencies
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Flake8 (Fatal Errors Only)
      run: flake8 . --count --select=E9,F63,F7,F82,F811,F841,F401 --show-source --statistics

    - name: Run Pytest Suite
      run: pytest

    - name: Generate Synthetic Test Videos
      run: bash experiments/make_test_clips.sh

    - name: Bit-Exact Test (Tags 1-3)
      run: |
        python experiments/gen_vectors.py
        node experiments/check_vectors.js

    - name: Bit-Exact Test (Tag 4 DCT)
      run: |
        python experiments/profile_vectors.py
        node experiments/check_profile.js

  frontend-test:
    name: Frontend V2 (TypeScript & WebGPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-v2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend-v2/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Typecheck
      run: npm run typecheck

    - name: Unit Tests
      run: npm test

    - name: Build
      run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: Build Docker Image
      run: docker build -t asciline:ci .
