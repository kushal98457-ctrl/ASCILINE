[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "asciline"
version = "0.2.0"
description = "A high-performance, cross-platform real-time ASCII and pixel video streaming engine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Kushal", email = "kushalgowda98457@gmail.com" },
    { name = "YusufB5" },
]
maintainers = [
    { name = "Kushal", email = "kushalgowda98457@gmail.com" },
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ytdlp = [
    "yt-dlp>=2026.07.04",
]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0",
    "colorama>=0.4.6",
]

[tool.setuptools]
packages = ["core"]
py-modules = [
    "ascii_video_player2",
    "codec",
    "compiler",
    "logo",
    "stream_server",
    "ytdl",
]

